# /etc/cyberdeck-pi4/ups.conf — GeeekPi UPS V5 addon configuration
# Sourced by ups_shutdown.sh (shell) and parsed by ups_daemon.py (Python).
# Keep to plain KEY=value lines — no shell expansion.

# --- I2C ---------------------------------------------------------------
UPS_I2C_BUS=1               # I2C bus number (1 = GPIO pins 2/3 on Pi 4)
UPS_I2C_ADDR=0x17           # UPS device address (factory default after firmware update)

# --- shutdown ----------------------------------------------------------
UPS_SHUTDOWN_DELAY=20       # seconds the UPS waits after Pi halts before cutting power
                             # minimum 10, maximum 255 (per UPS V5 register spec)

# --- polling -----------------------------------------------------------
UPS_POLL_SEC=30             # how often ups_daemon.py reads UPS registers (seconds)
